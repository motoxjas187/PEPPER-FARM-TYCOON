name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk PepperFarmTycoon.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PepperFarmTycoon-apk
          path: PepperFarmTycoon.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pepper Farm Tycoon build ${{ github.run_number }}
          body: "Download **PepperFarmTycoon.apk** below and open it on your Android phone to install. New builds install over old ones and keep your save."
          files: PepperFarmTycoon.apk
          make_latest: true
