<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pepper Farm Tycoon</title>
<style>
:root{--bg:#1d1410;--panel:#2c1f18;--gold:#ffc83d;--txt:#fff3e6;--mut:#c2a893;--green:#5cc43f;--red:#e5483b;--line:#4d3628}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
#hud{display:flex;align-items:center;gap:5px;padding:8px 8px 4px}
#coins{flex:1;min-width:0}
#coinv{font-size:21px;font-weight:900;color:#fff;text-shadow:0 2px 0 #000;white-space:nowrap}
#coinv b{color:var(--gold)}
#rate{font-size:11px;color:var(--mut);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{background:var(--panel);border:2px solid var(--line);color:var(--txt);border-radius:12px;padding:5px 3px;font-size:9.5px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:42px;flex:0 0 auto}
.hb span{font-size:18px;line-height:1}
.hb.glow{border-color:var(--gold);box-shadow:0 0 12px #ffc83d99}
#res{margin:0 10px 4px;font-size:11px;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:6px}
#res .bar{flex:1;margin:0}
#wrap{flex:1;position:relative;min-height:0}
canvas{position:absolute;top:0;touch-action:none}
#hint{font-size:12px;color:var(--mut);text-align:center;padding:3px 8px;min-height:19px}
#picker{display:none;gap:6px;padding:2px 8px 0;overflow-x:auto;touch-action:pan-x}
.chip{flex:0 0 auto;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:4px 6px;font-size:10px;font-weight:800;color:var(--txt);text-align:center;min-width:64px}
.chip span{display:block;font-size:18px}
.chip.on{border-color:var(--gold);background:#43301c}
.chip.lock{opacity:.5}
.chip.cat{min-width:76px;background:#3a2a1f}
.chip small{color:var(--mut);font-weight:700}
#wxb{background:var(--panel);border:2px solid var(--line);color:var(--txt);border-radius:10px;padding:2px 8px;font-size:12px;font-weight:800;white-space:nowrap}
#sheet input{width:100%;font-size:22px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:#1d1410;color:var(--txt);font-weight:800;letter-spacing:3px;user-select:text;-webkit-user-select:text;margin:6px 0}
#tools{display:flex;gap:5px;padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.tb{flex:1;background:var(--panel);border:2px solid var(--line);border-radius:12px;color:var(--txt);padding:6px 2px;font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}
.tb span{font-size:20px;line-height:1}
.tb.on{border-color:var(--gold);background:#43301c}
#toast{position:fixed;left:50%;top:96px;transform:translateX(-50%);background:#000d;border:2px solid var(--gold);padding:8px 14px;border-radius:12px;font-weight:800;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
#ov{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:10}
#sheet{background:var(--panel);border-top:3px solid var(--gold);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:82%;overflow:auto;padding:14px 14px calc(18px + env(safe-area-inset-bottom));touch-action:pan-y}
#sheet h2{margin:0 0 6px;font-size:19px}
#sheet h3{margin:12px 0 4px;font-size:15px;color:var(--gold)}
#sheet p{font-size:13px;color:#ecdccb;line-height:1.45;margin:6px 0}
.x{float:right;background:none;border:none;color:var(--mut);font-size:24px;line-height:1;padding:0 4px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #43302a}
.ri{font-size:24px;width:34px;text-align:center}
.rt{flex:1;min-width:0;font-size:14px}
.rt small{color:var(--gold);font-weight:800}
.rd{font-size:12px;color:var(--mut)}
.buy{background:var(--green);color:#10260a;border:none;border-radius:10px;padding:9px 8px;font-weight:900;min-width:80px;font-size:13px}
.buy.no{background:#4d3f36;color:#8f7c6c}
.buy.max{background:#4d3f36;color:var(--gold)}
.buy.wide{width:100%;margin-top:8px;padding:12px}
.buy.alt{background:#4d3f36;color:var(--txt)}
.bar{height:11px;background:#43302a;border-radius:7px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--gold);width:0}
.seg{display:flex;gap:5px;margin:6px 0;flex-wrap:wrap}
.seg button{flex:1;min-width:52px;background:#43302a;border:2px solid var(--line);color:var(--txt);border-radius:9px;padding:7px 2px;font-weight:800;font-size:12px}
.seg button.on{border-color:var(--gold);background:#5a3f1c}
.stat{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px dashed #43302a}
.stat b{color:var(--gold)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;margin-right:4px;border:1px solid #0006}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="coins"><div id="coinv">🪙 0</div><div id="rate">0 /min</div></div>
    <button class="hb" id="bUp"><span>⬆️</span>Upgrade</button>
    <button class="hb" id="bSeeds"><span>🌶️</span>Peppers</button>
    <button class="hb" id="bPr"><span>⭐</span>Prestige</button>
    <button class="hb" id="bHelp"><span>❓</span>Help</button>
    <button class="hb" id="bSet"><span>⚙️</span>Settings</button>
  </div>
  <div id="res"><span id="resl">Next: Banana Pepper</span><div class="bar"><i id="resb"></i></div><button id="wxb">⛅ --°</button></div>
  <div id="wrap"><canvas id="cv"></canvas></div>
  <div id="hint"></div>
  <div id="picker"></div>
  <div id="tools">
    <button class="tb on" data-t="hand"><span>👆</span>Select</button>
    <button class="tb" data-t="belt"><span>🛤️</span>Belt</button>
    <button class="tb" data-t="build"><span>🏗️</span>Build</button>
    <button class="tb" data-t="rot"><span>🔄</span>Rotate</button>
    <button class="tb" data-t="erase"><span>🗑️</span>Remove</button>
  </div>
</div>
<div id="toast"></div>
<div id="ov"><div id="sheet"></div></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const COLS=8,ROWS=14,SP=0.5,SAVE_KEY='pepperfarm_v1';
const DX=[1,0,-1,0],DY=[0,1,0,-1];

/* ---------------- data ---------------- */
const V=[
 {n:'Bell Pepper',shu:'0',val:3,g:3,c:'#3fae3a',sh:'bell'},
 {n:'Banana Pepper',shu:'500',val:8,g:3.5,c:'#f2d03b',sh:'chili'},
 {n:'Poblano',shu:'1.5K',val:20,g:4,c:'#1f6d2c',sh:'wide'},
 {n:'Jalapeño',shu:'5K',val:50,g:4.5,c:'#2f9a3c',sh:'chili'},
 {n:'Serrano',shu:'15K',val:125,g:5,c:'#61c24a',sh:'thin'},
 {n:'Cayenne',shu:'40K',val:310,g:5.5,c:'#d8322c',sh:'thin'},
 {n:'Thai Chili',shu:'75K',val:780,g:6,c:'#ff3b2e',sh:'tiny'},
 {n:'Habanero',shu:'250K',val:1950,g:7,c:'#ff8a00',sh:'lantern'},
 {n:'Ghost Pepper',shu:'1M',val:4900,g:8,c:'#b3201e',sh:'chili'},
 {n:'Carolina Reaper',shu:'2.2M',val:12200,g:9,c:'#c4161c',sh:'reaper'},
 {n:'Pepper X',shu:'2.7M',val:30500,g:10,c:'#7d0a0a',sh:'reaper'},
 {n:'Magma Hybrid',shu:'5M',val:76000,g:11,c:'#ff4d00',sh:'chili',x:1},
 {n:'Plasma Pod',shu:'9M',val:190000,g:12,c:'#19d3ff',sh:'lantern',x:1},
 {n:'Void Pepper',shu:'???',val:480000,g:14,c:'#8c5cff',sh:'reaper',x:1}
];
const BT={
 bank:{name:'Seed Bank',icon:'🌰',cost:200,col:'#8d5a2b',out:1,desc:'Sends seeds of the variety you pick onto its belt.'},
 farm:{name:'Farm Plot',icon:'🌱',cost:60,col:'#4f7f2a',out:1,desc:'Takes seeds, grows peppers, sends them out.'},
 market:{name:'Market',icon:'🏪',cost:300,col:'#2f8f4e',desc:'Sells peppers for coins. Better quality = more coins.'},
 taste:{name:'Customers',icon:'😋',cost:150,col:'#c0602f',desc:'Customers taste peppers. Better reaction = more seeds + tips.'},
 cross:{name:'Pollination Warehouse',icon:'🐝',cost:500,col:'#7a6a55',out:1,desc:'An indoor farm where bees cross pairs of peppers into seeds. Bacteria can\'t get in. Pairs of your newest variety research the next one.'},
 store:{name:'Storage',icon:'📦',cost:120,col:'#6d4a2b',out:1,desc:'Saves up product. Hold it, or release it down its belt.'},
 sort:{name:'Quality Sorter',icon:'🔍',cost:250,col:'#3d6fb0',out:1,desc:'Good peppers go straight out. Low-star and infected ones go out the sides.'},
 split:{name:'Splitter',icon:'🔀',cost:80,col:'#555d6b',out:1,desc:'Takes turns sending items out the front and both sides.'},
 spray:{name:'Pesticide Sprayer',icon:'🧴',cost:200,col:'#7b3fa0',desc:'Protects farms in the 3×3 area around it from bacteria, but lowers their pepper quality.'},
 compost:{name:'Compost Bin',icon:'♻️',cost:40,col:'#4e3b2a',desc:'Destroys anything sent into it. Good for rejects.'}
};
const BORDER=['farm','bank','market','taste','cross','store','sort','split','spray','compost'];
const UP=[
 {id:'rate',name:'Seed Bank Speed',icon:'🌰',desc:l=>fmt2(bankRate(l))+' seeds/s per lane',cost:l=>30*Math.pow(1.55,l),max:40},
 {id:'speed',name:'Belt Speed',icon:'⏩',desc:l=>(1+.2*l).toFixed(1)+' tiles/s',cost:l=>60*Math.pow(1.8,l),max:15},
 {id:'fert',name:'Fertilizer',icon:'💧',desc:l=>'grow speed ×'+fmt2(1/Math.pow(.88,l)),cost:l=>80*Math.pow(1.9,l),max:25},
 {id:'plots',name:'More Plots',icon:'🪴',desc:l=>(2+l)+' plots per farm',cost:l=>150*Math.pow(2.4,l),max:8},
 {id:'soil',name:'Rich Soil',icon:'🟫',desc:l=>'base quality '+(50+4*l),cost:l=>100*Math.pow(1.9,l),max:12},
 {id:'imm',name:'Plant Immunity',icon:'🛡️',desc:l=>Math.min(80,8*l)+'% chance to resist bacteria',cost:l=>120*Math.pow(2,l),max:10},
 {id:'eco',name:'Eco Pesticide',icon:'🍃',desc:l=>'spray quality penalty −'+Math.round(sprayPen(l)),cost:l=>200*Math.pow(2,l),max:10},
 {id:'hype',name:'Market Hype',icon:'📣',desc:l=>'sell price ×'+fmt2(Math.pow(1.25,l)),cost:l=>250*Math.pow(2.1,l),max:80},
 {id:'bays',name:'Pollination Bays',icon:'🐝',desc:l=>(1+l)+' pairs at once per warehouse',cost:l=>600*Math.pow(2.6,l),max:5},
 {id:'charm',name:'Customer Charm',icon:'💬',desc:l=>'+'+(5*l)+' reaction score',cost:l=>150*Math.pow(2,l),max:10}
];

/* ---------------- state ---------------- */
function fresh(){const tiles={},put=(x,y,o)=>tiles[x+','+y]=o;
 put(3,0,{k:'bank',d:1,v:0});put(3,1,{k:'belt',d:1});put(3,2,{k:'belt',d:1});
 put(3,3,{k:'farm',d:1,pl:[],inf:0});for(let y=4;y<9;y++)put(3,y,{k:'belt',d:1});put(3,9,{k:'market',d:1});
 return{v:1,coins:150,run:0,total:0,prest:0,up:Object.fromEntries(UP.map(u=>[u.id,0])),disc:1,res:0,seeds:V.map(()=>0),
  tiles,rate:0,t:Date.now(),seen:false,zip:'',zipAsked:false,wxOn:true,ob:75,st:{sold:0,fed:0,cross:0,lost:0}}}
function load(){try{const r=localStorage.getItem(SAVE_KEY);if(!r)return null;const d=JSON.parse(r),f=fresh();
 return Object.assign(f,d,{up:Object.assign(f.up,d.up),st:Object.assign(f.st,d.st)})}catch(e){return null}}
let S=load()||fresh();
function save(){S.t=Date.now();S.rate=perSec();try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}

/* ---------------- derived ---------------- */
const lanes=()=>Math.min(1+S.prest,5);
const bankRate=l=>.5*Math.pow(1.15,l);
const speed=()=>1+.2*S.up.speed;
const growT=t=>V[t].g*Math.pow(.88,S.up.fert);
const plots=()=>2+S.up.plots;
const sprayPen=l=>15*Math.pow(.8,l);
const stars=q=>Math.max(1,Math.min(5,Math.ceil(q/20)));
const vmult=()=>Math.pow(1.25,S.up.hype)*Math.pow(1.5,S.prest);
const price=it=>it.s?V[it.t].val*.2*vmult():V[it.t].val*(.4+1.2*it.q/100)*vmult()*(it.inf?.1:1);
const resNeed=()=>3+3*S.disc;
const presReq=()=>5e5*Math.pow(25,S.prest);
const STORE_CAP=60;
function countOf(k){let n=0;for(const key in S.tiles)if(S.tiles[key].k===k)n++;return n}
const bCost=k=>Math.floor(BT[k].cost*Math.pow(1.4,countOf(k)));

const SUF=['','K','M','B','T'];
function fmt(n){if(!isFinite(n))return'∞';if(n<1000)return n<10?String(Math.floor(n*10)/10):String(Math.floor(n));
 const e=Math.floor(Math.log10(n)/3);let s;if(e<SUF.length)s=SUF[e];else{const k=e-SUF.length;s=String.fromCharCode(97+Math.floor(k/26)%26)+String.fromCharCode(97+k%26)}
 return(Math.floor(n/Math.pow(1000,e)*100)/100).toFixed(2)+s}
const fmt2=n=>n<100?n.toFixed(2):fmt(n);
const K=(x,y)=>x+','+y, xy=k=>k.split(',').map(Number), inG=(x,y)=>x>=0&&y>=0&&x<COLS&&y<ROWS;
const tileAt=(x,y)=>S.tiles[K(x,y)];

/* ---------------- weather ---------------- */
const REG={NE:{n:'Northeast',w:38,s:82,r:.3},SE:{n:'Southeast',w:58,s:91,r:.38},FL:{n:'Florida',w:75,s:91,r:.4},MW:{n:'Midwest / Plains',w:32,s:85,r:.28},
 SC:{n:'South Central',w:62,s:96,r:.22},MT:{n:'Mountain West',w:42,s:88,r:.15},DS:{n:'Desert Southwest',w:66,s:106,r:.08},WC:{n:'West Coast',w:58,s:80,r:.2},
 AK:{n:'Alaska',w:22,s:65,r:.3},HI:{n:'Hawaii',w:80,s:88,r:.35},DF:{n:'Mild (default)',w:60,s:85,r:.25}};
function regionOf(z){if(!/^\d{5}$/.test(z||''))return'DF';const p=+z.slice(0,3),d=+z[0];
 if(p>=995)return'AK';if(p>=967&&p<=968)return'HI';if((p>=850&&p<=865)||(p>=889&&p<=898))return'DS';if((p>=800&&p<=849)||(p>=870&&p<=885))return'MT';
 if(p>=900)return'WC';if(p>=320&&p<=349)return'FL';if(p>=700&&p<=799)return'SC';if(d<=1)return'NE';if(d<=3)return'SE';return'MW'}
const WXT={sunny:{i:'☀️',n:'Sunny',g:1.2,q:3,b:1,d:'Peppers grow 20% faster (+3 quality)'},
 night:{i:'🌙',n:'Clear night',g:.85,q:0,b:1,d:'Growth slows 15% overnight'},
 cloudy:{i:'⛅',n:'Cloudy',g:1,q:0,b:1,d:'Normal growth'},
 rain:{i:'🌧️',n:'Rain',g:1.3,q:0,b:1.5,d:'Growth +30%, but bacteria spread 50% faster'},
 storm:{i:'⛈️',n:'Thunderstorm',g:.6,q:-10,b:2,d:'Growth −40%, −10 quality, bacteria spread twice as fast'},
 heat:{i:'🔥',n:'Heat wave',g:1,q:0,b:1.3,d:'Hot peppers (Cayenne and up) grow 35% faster; mild ones 25% slower'},
 frost:{i:'❄️',n:'Frost',g:.4,q:-5,b:.5,d:'Growth −60%, −5 quality, bacteria slow down'}};
let WX={type:'cloudy',temp:70,key:''};
function mul32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hsh(str){let h=2166136261;for(const c of str)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
function updWx(force){const blk=Math.floor(Date.now()/18e4),d=new Date(),hr=d.getHours(),key=S.zip+'|'+blk+'|'+hr;if(!force&&key===WX.key)return;
 const reg=REG[regionOf(S.zip)],rnd=mul32(hsh(key)),m=d.getMonth()+d.getDate()/31,sea=(1-Math.cos(2*Math.PI*(m-.5)/12))/2,night=hr<6||hr>=20;
 const temp=Math.round(reg.w+(reg.s-reg.w)*sea+(rnd()*16-8)-(night?15:0));let type;const r=rnd();
 if(temp<=34&&r<.7)type='frost';else if(temp>=96&&r<.6)type='heat';else{const r2=rnd();if(r2<reg.r)type=r2<reg.r*.25?'storm':'rain';else type=night?'night':(rnd()<.6?'sunny':'cloudy')}
 const prev=WX.type;WX={type,temp,key,until:(blk+1)*18e4};if(WX.key&&prev!==type&&S.wxOn&&!force)toast(WXT[type].i+' Weather changed: '+WXT[type].n)}
const wxOn=()=>S.wxOn;
const wxGrow=t=>!wxOn()?1:WX.type==='heat'?(t>=5?1.35:.75):WXT[WX.type].g;
const wxQ=()=>wxOn()?WXT[WX.type].q:0;
const wxBact=()=>wxOn()?WXT[WX.type].b:1;

/* ---------------- geometry ---------------- */
let BI={},GEO={},PROT=new Set(),RR={};
const nrm=d=>[-DY[d],DX[d]];
function geom(x,y,i,o,L){const cx=x+.5,cy=y+.5,E=[cx-DX[i]*.5,cy-DY[i]*.5],X=[cx+DX[o]*.5,cy+DY[o]*.5],ni=nrm(i),no=nrm(o);
 const mk=d=>{const c=i===o?[no[0]*d,no[1]*d]:[(ni[0]+no[0])*d,(ni[1]+no[1])*d];return[[E[0]+ni[0]*d,E[1]+ni[1]*d],[cx+c[0],cy+c[1]],[X[0]+no[0]*d,X[1]+no[1]*d]]};
 const g={l:[],dv:[],c:mk(0)};for(let l=0;l<L;l++)g.l.push(mk(((l+.5)/L-.5)*.76));for(let l=1;l<L;l++)g.dv.push(mk((l/L-.5)*.76));return g}
function feeds(nb,s){return nb&&nb.d===s&&(nb.k==='belt'||BT[nb.k].out)}
function rebuild(){const L=lanes();
 for(const k in BI)if(!S.tiles[k]||S.tiles[k].k!=='belt')delete BI[k];
 GEO={};PROT=new Set();
 for(const k in S.tiles){const t=S.tiles[k],[x,y]=xy(k);
  if(t.k==='belt'){if(!BI[k])BI[k]=[];while(BI[k].length<L)BI[k].push([]);
   let ind=t.d;if(!feeds(tileAt(x-DX[t.d],y-DY[t.d]),t.d)){for(const s of[(t.d+1)%4,(t.d+3)%4])if(feeds(tileAt(x-DX[s],y-DY[s]),s)){ind=s;break}}
   GEO[k]=geom(x,y,ind,t.d,L)}
  if(t.k==='spray')for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)PROT.add(K(x+a,y+b))}
 renderPicker()}
function posAt(g,l,p){const[E,C,X]=g.l[l];if(p<.5){const t=p*2;return[E[0]+(C[0]-E[0])*t,E[1]+(C[1]-E[1])*t]}const t=(p-.5)*2;return[C[0]+(X[0]-C[0])*t,C[1]+(X[1]-C[1])*t]}

/* ---------------- movement ---------------- */
function insLane(k,l,it){const a=BI[k][l],last=a[a.length-1];if(last&&last.p<SP)return false;it.p=0;a.push(it);return true}
function push(x,y,d,it,lane){const nx=x+DX[d],ny=y+DY[d],nk=K(nx,ny),nt=S.tiles[nk];if(!nt)return false;
 if(nt.k==='belt'){if(nt.d===(d+2)%4||!BI[nk])return false;const L=lanes();
  if(lane!==undefined&&lane<L)return insLane(nk,lane,it);
  const r=RR[nk]||0;for(let i=0;i<L;i++){const l=(r+i)%L;if(insLane(nk,l,it)){RR[nk]=l+1;return true}}return false}
 return accept(nt,nk,it,d)}
function accept(t,k,it,d){
 switch(t.k){
  case'farm':if(!it.s||t.pl.length>=plots()+(t.hy?2:0))return false;t.pl.push({t:it.t,g:0});return true;
  case'market':{const g=price(it);earn(g);S.st.sold++;fl(k,'+'+fmt(g),'#ffc83d');return true}
  case'taste':if(it.s||(t.q=t.q||[]).length>=2)return false;t.q.push(it);return true;
  case'cross':if(it.s||(t.q=t.q||[]).length>=2*(1+S.up.bays))return false;t.q.push(it);return true;
  case'store':if((t.c=t.c||[]).length>=STORE_CAP)return false;t.c.push(it);return true;
  case'sort':case'split':if(t.buf)return false;t.buf=it;return true;
  case'compost':if(Math.random()<.3)fl(k,'♻️','#9ccf6a');return true;
 }return false}

/* ---------------- floats / earnings ---------------- */
const floats=[];const flAcc={};
function fl(k,txt,col){const[x,y]=xy(k);floats.push({x:x+.5,y:y+.15,t:1,txt,col})}
const buckets=new Array(60).fill(0);let bi=0,secs=0,secAcc=0,saveAcc=0,flashT=0;
function earn(g){S.coins+=g;S.run+=g;S.total+=g;buckets[bi]+=g}
function perSec(){const k=Math.min(secs,59)+secAcc;if(k<1)return 0;let s=0;for(const b of buckets)s+=b;return s/k}

/* ---------------- buildings ---------------- */
function emit(t,x,y,it,dirs){const n=dirs.length,r=t.rr||0;for(let i=0;i<n;i++){const d=dirs[(r+i)%n];if(push(x,y,d,it)){t.rr=(r+i+1)%n;return true}}return false}
function harvestQ(k,hy){let q=50+4*S.up.soil+(Math.random()*30-15)+(hy?0:wxQ());if(PROT.has(k))q-=sprayPen(S.up.eco);return Math.round(Math.max(1,Math.min(100,q)))}
function react(t,k,it){let n,e;
 if(it.inf){n=0;e='🤢'}else{const sc=it.q+(Math.random()*40-20)+5*S.up.charm,hot=it.t>=7;
  if(sc>=85){n=3;e=hot?'🥵':'😍'}else if(sc>=65){n=2;e=hot?'🔥':'😋'}else if(sc>=45){n=1;e='😐'}else{n=0;e='😖'}}
 if(it.t>0)S.seeds[it.t]+=n;const tip=n*V[it.t].val*.15*vmult();if(tip>0)earn(tip);S.st.fed++;
 fl(k,e+(n&&it.t>0?' +'+n+'🌰':''),'#fff')}
function crossPair(k,a,b){
 if(a.inf||b.inf){fl(k,'🦠 ruined','#c79bff');return}
 const top=Math.max(a.t,b.t);if(top>0)S.seeds[top]+=2;S.st.cross++;
 if(a.t===S.disc-1&&b.t===S.disc-1&&S.disc<V.length){S.res+=Math.min(1.2,(a.q+b.q)/140);
  if(S.res>=resNeed()){S.res=0;S.disc++;S.seeds[S.disc-1]+=5;toast('🎉 New variety: '+V[S.disc-1].n+'! +5 seeds');flashT=.6;save()}}
 fl(k,top>0?'+2🌰':'🐝','#ffe08a')}
function updB(t,k,dt){const[x,y]=xy(k);
 switch(t.k){
  case'bank':{const L=lanes(),r=bankRate(S.up.rate);t.a=t.a||[];
   for(let l=0;l<L;l++){t.a[l]=(t.a[l]||0)+r*dt;if(t.a[l]<1)continue;
    if(t.v>0&&S.seeds[t.v]<=0){t.a[l]=1;continue}
    if(push(x,y,t.d,{s:1,t:t.v,q:0,inf:false},l)){t.a[l]-=1;if(t.v>0)S.seeds[t.v]--}else t.a[l]=1}break}
  case'farm':{if(t.inf>0)t.inf=Math.max(0,t.inf-dt);
   for(let i=0;i<t.pl.length;i++){const p=t.pl[i];
    if(p.g<1){p.g+=dt*(t.hy?1:wxGrow(p.t))/(growT(p.t)*(t.hy?.4:1));continue}
    if(!p.it)p.it={s:0,t:p.t,q:t.inf>0?5:harvestQ(k,t.hy),inf:t.inf>0};
    if(emit(t,x,y,p.it,[t.d])){t.pl.splice(i,1);i--}}break}
  case'taste':if(t.q&&t.q.length){t.tm=(t.tm||0)+dt;if(t.tm>=1.2){t.tm=0;react(t,k,t.q.shift())}}break;
  case'cross':{t.sl=t.sl||[];while(t.sl.length<1+S.up.bays&&t.q&&t.q.length>=2){const p=t.q.splice(0,2);t.sl.push({a:p[0],b:p[1],g:0})}
   for(let i=0;i<t.sl.length;i++){const q=t.sl[i];q.g+=dt/2.5;if(q.g>=1){crossPair(k,q.a,q.b);t.sl.splice(i,1);i--}}break}
  case'store':if(!t.hold&&t.c&&t.c.length){t.tm=(t.tm||0)+dt;while(t.tm>=.25&&t.c.length){if(emit(t,x,y,t.c[0],[t.d])){t.c.shift();t.tm-=.25}else{t.tm=.25;break}}}break;
  case'sort':if(t.buf){const it=t.buf,thr=t.thr||3,pass=it.s||(!it.inf&&stars(it.q)>=thr);
   if(pass?push(x,y,t.d,it):emit(t,x,y,it,[(t.d+3)%4,(t.d+1)%4]))t.buf=null}break;
  case'split':if(t.buf&&emit(t,x,y,t.buf,[t.d,(t.d+3)%4,(t.d+1)%4]))t.buf=null;break;
 }}
function outbreak(){S.ob=40+Math.random()*50;const farms=Object.keys(S.tiles).filter(k=>S.tiles[k].k==='farm');if(!farms.length)return;
 const k=farms[Math.floor(Math.random()*farms.length)],t=S.tiles[k];
 if(PROT.has(k)){toast('🧴 Sprayer blocked a bacteria outbreak');fl(k,'🛡️','#c79bff');return}
 if(Math.random()<Math.min(.8,.08*S.up.imm)){toast('🛡️ Natural defenses fought off bacteria');fl(k,'🛡️','#9ccf6a');return}
 S.st.lost+=t.pl.length;t.pl=[];t.inf=25;flashT=.8;toast('🦠 Bacteria hit a farm! Crops destroyed — its peppers come out infected for 25s')}

/* ---------------- step ---------------- */
function step(dt){const L=lanes(),mv=speed()*dt;
 for(const k in BI){const t=S.tiles[k];if(!t||t.k!=='belt')continue;const[x,y]=xy(k),ls=BI[k];
  for(let l=0;l<L&&l<ls.length;l++){const a=ls[l];
   for(let i=0;i<a.length;i++){const it=a[i],lim=i===0?1:a[i-1].p-SP;if(lim>it.p)it.p=Math.min(it.p+mv,lim)}
   if(a.length&&a[0].p>=1&&push(x,y,t.d,a[0],l))a.shift()}}
 for(const k in S.tiles){const t=S.tiles[k];if(t.k!=='belt')updB(t,k,dt)}
 S.ob-=dt*wxBact();if(S.ob<=0)outbreak();
 for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t-=dt*.8;f.y-=dt*.5;if(f.t<=0)floats.splice(i,1)}
 if(floats.length>60)floats.splice(0,floats.length-60);
 flashT=Math.max(0,flashT-dt);
 secAcc+=dt;if(secAcc>=1){secAcc-=1;bi=(bi+1)%60;buckets[bi]=0;secs++}
 saveAcc+=dt;if(saveAcc>5){saveAcc=0;save()}}

const cv=$('#cv'),ctx=cv.getContext('2d');let T=40,W=0,H=0;

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

 if(it.s){ctx.fillStyle='#ead9a8';ctx.strokeStyle='#8a6a3a';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(x,y,r*.5,r*.36,-.5,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle=v.c;ctx.beginPath();ctx.arc(x,y,r*.17,0,7);ctx.fill();return}
 if(v.x){ctx.fillStyle=v.c+'55';ctx.beginPath();ctx.arc(x,y,r*.98,0,7);ctx.fill()}
 ctx.fillStyle=v.c;ctx.strokeStyle='#0007';ctx.lineWidth=Math.max(1,s*.05);ctx.beginPath();
 if(v.sh==='bell')ctx.ellipse(x,y+r*.1,r*.62,r*.6,0,0,7);
 else if(v.sh==='lantern')ctx.ellipse(x,y+r*.1,r*.5,r*.58,0,0,7);
 else if(v.sh==='wide')ctx.ellipse(x,y+r*.08,r*.4,r*.72,.35,0,7);

 ctx.fill();ctx.stroke();
 if(v.sh==='reaper'){ctx.beginPath();ctx.moveTo(x+r*.18,y+r*.6);ctx.lineTo(x+r*.55,y+r*.82);ctx.lineTo(x+r*.3,y+r*.48);ctx.fill()}
 if(v.sh==='bell'){ctx.strokeStyle='#0003';ctx.beginPath();ctx.moveTo(x,y-r*.3);ctx.lineTo(x,y+r*.6);ctx.stroke()}
 ctx.fillStyle='#ffffff55';ctx.beginPath();ctx.ellipse(x-r*.16,y,r*.08,r*.22,0,0,7);ctx.fill();
 ctx.strokeStyle='#2e6b1f';ctx.lineWidth=Math.max(1.5,r*.16);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y-r*.45);ctx.lineTo(x+r*.15,y-r*.85);ctx.stroke();ctx.lineCap='butt';
 if(it.inf){ctx.fillStyle='#b04dff';for(const[a,b]of[[-.3,.2],[.25,-.05],[.05,.45]]){ctx.beginPath();ctx.arc(x+a*r,y+b*r,r*.13,0,7);ctx.fill()}}
 else if(stars(it.q)>=5){ctx.fillStyle='#fff6a0';ctx.beginPath();ctx.arc(x+r*.55,y-r*.5,r*.14,0,7);ctx.fill()}}
function arrow(cx,cy,d,col,s){const ax=cx+DX[d]*s*.42,ay=cy+DY[d]*s*.42,n=nrm(d);ctx.fillStyle=col;ctx.beginPath();
 ctx.moveTo(ax+DX[d]*s*.1,ay+DY[d]*s*.1);ctx.lineTo(ax+n[0]*s*.12,ay+n[1]*s*.12);ctx.lineTo(ax-n[0]*s*.12,ay-n[1]*s*.12);ctx.closePath();ctx.fill()}
function beacon(bx,by,s,now){const a=now/160;ctx.save();ctx.globalCompositeOperation='lighter';
 for(const off of[0,Math.PI]){const g=ctx.createRadialGradient(bx,by,0,bx,by,s*.75);g.addColorStop(0,'rgba(255,40,30,.75)');g.addColorStop(1,'rgba(255,40,30,0)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(bx,by);ctx.arc(bx,by,s*.75,a+off-.35,a+off+.35);ctx.closePath();ctx.fill()}
 ctx.restore();ctx.fillStyle='#444';ctx.fillRect(bx-s*.1,by+s*.04,s*.2,s*.07);ctx.fillStyle=Math.sin(now/80)>0?'#ff3b2e':'#c41c12';ctx.beginPath();ctx.arc(bx,by,s*.09,Math.PI,0);ctx.lineTo(bx+s*.09,by+s*.05);ctx.lineTo(bx-s*.09,by+s*.05);ctx.closePath();ctx.fill();
 ctx.fillStyle='#fff8';ctx.beginPath();ctx.arc(bx-s*.03,by-s*.03,s*.025,0,7);ctx.fill()}
function drawB(k,t,now){const[x,y]=xy(k),b=BT[t.k],s=T*.92,px=x*T+T*.04,py=y*T+T*.04,cx=(x+.5)*T,cy=(y+.5)*T;
 ctx.fillStyle=b.col;rr(px,py,s,s,s*.16);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#0008';ctx.stroke();
 if(t.k==='farm'){ctx.fillStyle=t.hy?'#2b7fb8':'#5b3a1e';rr(px+s*.1,py+s*.1,s*.8,s*.62,s*.08);ctx.fill();const n=plots()+(t.hy?2:0);
  if(t.hy){ctx.strokeStyle='#8fd6ff88';ctx.lineWidth=1;for(let j=0;j<3;j++){const wy=py+s*(.2+.18*j)+Math.sin(now/400+j)*s*.02;ctx.beginPath();ctx.moveTo(px+s*.14,wy);ctx.lineTo(px+s*.86,wy);ctx.stroke()}}
  for(let i=0;i<n;i++){const p=t.pl[i],ix=px+s*(.18+(.64*(i%3))/2),iy=py+s*(.24+.28*Math.floor(i/3)),rad=s*.09;
   if(i>=6)break;ctx.fillStyle=t.hy?'#e8f6ff':'#3e2914';ctx.beginPath();ctx.arc(ix,iy,rad,0,7);ctx.fill();
   if(p){const g=Math.min(1,p.g);ctx.fillStyle=g>=1?V[p.t].c:'#6fc24a';ctx.beginPath();ctx.arc(ix,iy,rad*(.35+.65*g),0,7);ctx.fill()}}
  if(PROT.has(k)){ctx.fillStyle='#c79bff';ctx.beginPath();ctx.arc(px+s*.88,py+s*.12,s*.08,0,7);ctx.fill()}
  txt(t.inf>0?'🦠 '+Math.ceil(t.inf)+'s':t.pl.length+'/'+n,cx,py+s*.84,Math.max(7,T*.17),t.inf>0?'#d9a8ff':'#e6ffd0');
  if(t.inf>0){ctx.fillStyle='rgba(150,60,220,'+(.2+.1*Math.sin(now/200))+')';rr(px,py,s,s,s*.16);ctx.fill()}}
 else if(t.k==='cross'){const n=1+S.up.bays;ctx.fillStyle='#9a8466';ctx.beginPath();ctx.moveTo(px,py+s*.3);ctx.lineTo(cx,py+s*.06);ctx.lineTo(px+s,py+s*.3);ctx.closePath();ctx.fill();
  ctx.fillStyle='#2e3a22';rr(px+s*.1,py+s*.34,s*.8,s*.4,s*.05);ctx.fill();
  for(let i=0;i<n;i++){const q=t.sl&&t.sl[i],ix=px+s*(.18+.64*(n===1?.5:i/(n-1))),iy=py+s*.54;ctx.fillStyle='#4b3620';ctx.beginPath();ctx.arc(ix,iy,s*.07,0,7);ctx.fill();
   if(q){ctx.fillStyle=V[Math.max(q.a.t,q.b.t)].c;ctx.beginPath();ctx.arc(ix,iy,s*.07*(.4+.6*q.g),0,7);ctx.fill()}}
  if(t.sl&&t.sl.length){const a=now/300;emo('🐝',cx+Math.cos(a)*s*.25,py+s*.46+Math.sin(a*1.7)*s*.08,s*.2)}else emo('🐝',cx,py+s*.2,s*.16);
  txt(Math.floor(S.res)+'/'+resNeed(),cx,py+s*.86,Math.max(7,T*.17))}
 else if(t.k==='bank'){emo('🌰',cx-s*.17,cy-s*.08,s*.3);drawPep(cx+s*.2,cy-s*.08,s*.38,{s:0,t:t.v,q:50});
  txt(t.v===0?'∞':fmt(S.seeds[t.v]),cx,py+s*.82,Math.max(7,T*.18),t.v>0&&S.seeds[t.v]<=0?'#ff8a7a':'#fff')}
 else{emo(b.icon,cx,cy-s*.06,s*.4);let lab='';
  if(t.k==='store')lab=(t.c?t.c.length:0)+(t.hold?' ⏸':'');

  if(lab)txt(lab,cx,py+s*.84,Math.max(7,T*.17))}
 if(b.out){arrow(cx,cy,t.d,'#ffd84a',T);if(t.k==='sort'){arrow(cx,cy,(t.d+1)%4,'#ff6a5a',T);arrow(cx,cy,(t.d+3)%4,'#ff6a5a',T)}
  if(t.k==='split'){arrow(cx,cy,(t.d+1)%4,'#ffd84a',T);arrow(cx,cy,(t.d+3)%4,'#ffd84a',T)}}
 if(selK===k){ctx.strokeStyle='#fff';ctx.lineWidth=3;rr(px-2,py-2,s+4,s+4,s*.18);ctx.stroke()}}

 if(tool==='belt'){drag={x,y,moved:false};if(!t){S.tiles[k]={k:'belt',d:S.lastD??1};rebuild()}return}
 if(tool==='build')return place(x,y);
 if(tool==='rot'){if(t&&(t.k==='belt'||BT[t.k].out)){t.d=(t.d+1)%4;if(t.k==='belt')clearBelt(k);rebuild();save()}return}
 if(tool==='erase'){if(!t)return;if(t.k!=='belt'){if(countOf('bank')===1&&t.k==='bank'){toast('Keep at least one Seed Bank');return}
   const ref=Math.floor(BT[t.k].cost*Math.pow(1.4,countOf(t.k)-1)*.75);S.coins+=ref;toast('Removed '+BT[t.k].name+' (+'+fmt(ref)+')')}
  delete S.tiles[k];rebuild();save()}});
cv.addEventListener('pointermove',e=>{if(!drag)return;const[x,y]=cellOf(e);if(!inG(x,y))return;let g=0;
 while((drag.x!==x||drag.y!==y)&&g++<30){const dx=Math.sign(x-drag.x),dy=Math.sign(y-drag.y),nx=dx?drag.x+dx:drag.x,ny=dx?drag.y:drag.y+dy;beltStep(nx,ny)}});
const endDrag=()=>{if(drag){drag=null;save()}};cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
function clearBelt(k){if(BI[k])BI[k].forEach(a=>a.length=0)}
function beltStep(nx,ny){const d=nx>drag.x?0:nx<drag.x?2:ny>drag.y?1:3,pt=tileAt(drag.x,drag.y);
 if(pt){if(pt.k==='belt'){if(pt.d!==d){pt.d=d;clearBelt(K(drag.x,drag.y))}}else if(BT[pt.k].out&&pt.k!=='sort'&&pt.k!=='split')pt.d=d}
 S.lastD=d;const nk=K(nx,ny),nt=S.tiles[nk];
 if(!nt)S.tiles[nk]={k:'belt',d};else if(nt.k==='belt'&&nt.d!==d&&nt.d!==(d+2)%4){nt.d=d;clearBelt(nk)}
 drag.x=nx;drag.y=ny;rebuild()}
function place(x,y){const k=K(x,y),t=S.tiles[k];
 if(t&&t.k!=='belt'){openSheet('b',k);return}
 if(!pickK){toast(cat?'Pick a building first':'Pick a category, then a building');return}
 const c=bCost(pickK);if(S.coins<c){toast('Need 🪙'+fmt(c)+' for '+BT[pickK].name);return}
 S.coins-=c;const o={k:pickK,d:t?t.d:(S.lastD??1)};if(pickK==='farm'){o.pl=[];o.inf=0}if(pickK==='bank')o.v=0;
 S.tiles[k]=o;rebuild();save();toast(BT[pickK].icon+' '+BT[pickK].name+' built')}

/* ---------------- UI ---------------- */
function renderPicker(){if(tool!=='build')return;let h;
 if(!cat)h=CATS.map(c=>`<button class="chip cat" data-cat="${c.id}"><span>${c.icon}</span>${c.name}<br><small>${c.items.map(k=>BT[k].icon).join(' ')}</small></button>`).join('');
 else{const c=CATS.find(x=>x.id===cat);h=`<button class="chip cat" data-cat=""><span>⬅️</span>Back<br><small>${c.name}</small></button>`+c.items.map(k=>{const co=bCost(k);
  return`<button class="chip ${k===pickK?'on':''} ${S.coins<co?'lock':''}" data-k="${k}"><span>${BT[k].icon}</span>${BT[k].name}<br>🪙${fmt(co)}</button>`}).join('')}
 $('#picker').innerHTML=h}
$('#picker').addEventListener('click',e=>{const c=e.target.closest('[data-cat]');if(c){cat=c.dataset.cat||null;pickK=null;if(cat){const items=CATS.find(x=>x.id===cat).items;if(items.length===1)pickK=items[0]}renderPicker();return}
 const b=e.target.closest('[data-k]');if(!b)return;pickK=b.dataset.k;renderPicker();$('#hint').textContent='Tap a tile or belt to place '+BT[pickK].name+'. Tap 🏗️ Build again when done.'});
let tT=0;function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(tT);tT=setTimeout(()=>t.style.opacity=0,2600)}
let sheetKind=null,sheetArg=null;
function openSheet(k,a){sheetKind=k;sheetArg=a;if(k==='b')selK=a;render();$('#ov').style.display='flex'}
function closeSheet(){sheetKind=null;selK=null;$('#ov').style.display='none'}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov'&&sheetKind!=='zip')closeSheet()});
const X='<button class="x" data-a="close">✕</button>';
const buy=(a,c,mx)=>mx?'<button class="buy max">MAX</button>':`<button class="buy" data-a="${a}" data-c="${c}">🪙 ${fmt(c)}</button>`;
const dot=t=>`<span class="dot" style="background:${V[t].c}"></span>`;
const seedPrice=t=>V[t].val*1.2*Math.pow(1.25,S.up.hype)*10;
function render(){const sh=$('#sheet');let h='';
 if(sheetKind==='up'){h=X+'<h2>⬆️ Upgrades</h2>';for(const u of UP){const l=S.up[u.id],mx=l>=u.max;
   h+=`<div class="row"><div class="ri">${u.icon}</div><div class="rt"><b>${u.name}</b> <small>Lv ${l}</small><div class="rd">${u.desc(l)}${mx?'':' → '+u.desc(l+1)}</div></div>${buy('up:'+u.id,u.cost(l),mx)}</div>`}}
 else if(sheetKind==='seeds'){h=X+'<h2>🌶️ Pepper Varieties</h2><p>Hotter peppers sell for more. Discover the next one by crossing pairs of your newest variety in a 🐝 Pollination Warehouse.</p>';
  V.forEach((v,t)=>{if(t<S.disc){h+=`<div class="row"><div class="ri">${dot(t)}</div><div class="rt"><b>${v.n}</b> ${v.x?'<small>EXPERIMENTAL</small>':''}<div class="rd">${v.shu} SHU • worth ~${fmt(V[t].val*vmult())} • grows ${fmt2(growT(t))}s • seeds: ${t===0?'∞':fmt(S.seeds[t])}</div></div>${t===0?'':buy('seed:'+t,seedPrice(t),false).replace('🪙','10🌰 🪙')}</div>`}
   else if(t===S.disc){h+=`<div class="row"><div class="ri">❓</div><div class="rt"><b>${v.x?'Experimental #'+(t-10):'???'}</b><div class="rd">Research ${fmt2(S.res)} / ${resNeed()} pairs of ${V[t-1].n}</div><div class="bar"><i style="width:${S.res/resNeed()*100}%"></i></div></div></div>`}});
  if(S.disc>=V.length)h+='<p>🏆 Every variety discovered!</p>'}
 else if(sheetKind==='pr'){const req=presReq(),ok=S.run>=req,L=lanes(),nl=Math.min(L+1,5);
  h=X+`<h2>⭐ Prestige</h2><p>Reset coins, upgrades and seed stock. You keep your farm layout and every variety you've discovered. In return:</p>
  <div class="stat"><span>Belt lanes</span><b>${L} → ${nl}${nl===L?' (max)':''}</b></div>
  <div class="stat"><span>Pepper value</span><b>×${fmt2(Math.pow(1.5,S.prest))} → ×${fmt2(Math.pow(1.5,S.prest+1))}</b></div>
  <div class="stat"><span>Earned this run</span><b><span id="prv">${fmt(S.run)}</span> / ${fmt(req)}</b></div>
  <div class="bar"><i id="prb" style="width:${Math.min(100,S.run/req*100)}%"></i></div>
  <button class="buy wide ${ok?'':'no'}" data-a="pres">${ok?'PRESTIGE NOW':'Keep growing…'}</button>`}
 else if(sheetKind==='help'){h=X+`<h2>🌶️ How to play</h2>
  <p><b>The chain:</b> 🌰 Seed Bank → belt → 🌱 Farm (seeds grow into peppers) → belt → 🏪 Market for coins.</p>
  <p><b>Branch it</b> with a 🔀 Splitter so peppers also reach:</p>
  <p>😋 <b>Customers</b>: they taste each pepper. The better they like it, the more seeds of that variety you get back (plus tips).<br>🐝 <b>Pollination Warehouse</b>: an indoor farm where bees cross pairs of peppers into seeds. Pairs of your newest variety unlock the next hotter one, from Bell through Habanero, Ghost and Reaper, up to Experimental.<br>📦 <b>Storage</b>: saves up product. Set it to Hold, then Release it where you want it.</p>
  <p>💧 Tap a farm to convert it to <b>Hydroponic</b> for much faster growth.</p>
  <p><b>Bacteria</b> randomly hit farms (a red light spins on infected ones): crops are destroyed and the farm puts out infected 🦠 peppers for a while. Defend with 🛡️ Plant Immunity (natural, no downside) or a 🧴 Pesticide Sprayer (total protection but lower quality).</p>
  <p>🔍 <b>Quality Sorters</b> pass good peppers out the front and kick low-star or infected ones out the sides (send those to ♻️ Compost).</p>
  <p><b>Controls:</b> 🛤️ drag to lay belts (they point the way you drag). 🏗️ tap a tile or belt to build. Tap a tool again to go back to Select. 🔄 rotate. Yellow arrows show where things come out.</p>
  <p>🌦️ <b>Weather</b> follows your ZIP code's climate and changes every few minutes. Rain speeds growth but spreads bacteria; frost and storms slow it down. Hydroponic farms and warehouses are indoors and aren't affected. Tap the weather chip for details.</p>
  <p>⭐ <b>Prestige</b> widens every belt: 1 → 5 lanes.</p>
  <button class="buy wide" data-a="close">Start farming!</button>`}
 else if(sheetKind==='zip'){h=(sheetArg?'':X)+`<h2>🌦️ Where's your farm?</h2><p>Enter your ZIP code. Your farm's weather follows your area's climate, the current season and the time of day.</p>
  <input id="zipi" inputmode="numeric" pattern="[0-9]*" maxlength="5" placeholder="e.g. 78201" value="${S.zip||''}">
  <button class="buy wide" data-a="zipsave">Save ZIP code</button><button class="buy alt wide" data-a="zipskip">${sheetArg?'Skip (use a mild default climate)':'Cancel'}</button>
  <p style="color:var(--mut)">Your ZIP stays on this device and is only used to pick your climate zone.</p>`}
 else if(sheetKind==='set'){h=X+`<h2>⚙️ Settings</h2><div class="stat"><span>ZIP code</span><b>${S.zip||'not set'}</b></div><div class="stat"><span>Climate zone</span><b>${REG[regionOf(S.zip)].n}</b></div>
  <button class="buy alt wide" data-a="zipopen">📍 Change ZIP code</button>
  <h3>Weather effects</h3><div class="seg"><button class="${S.wxOn?'on':''}" data-a="wxon:1">On</button><button class="${S.wxOn?'':'on'}" data-a="wxon:0">Off</button></div>
  <h3>Danger zone</h3><button class="buy alt wide" data-a="reset" style="color:#ff8a7a">${resetArm?'Tap again to erase everything':'Reset game'}</button>`}
 else if(sheetKind==='wx'){const w=WXT[WX.type],left=Math.max(0,Math.ceil((WX.until-Date.now())/1000));
  h=X+`<h2>${w.i} ${w.n} • ${WX.temp}°F</h2><p><b>${S.wxOn?w.d:'Weather effects are off.'}</b></p>
  <div class="stat"><span>Climate zone</span><b>${REG[regionOf(S.zip)].n}${S.zip?' ('+S.zip+')':''}</b></div>
  <div class="stat"><span>Next change</span><b>~${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</b></div>
  <p>💧 Hydroponic farms and 🐝 Pollination Warehouses are indoors, so weather doesn't affect them.</p>
  <h3>Weather guide</h3>${Object.values(WXT).map(x=>`<div class="stat"><span>${x.i} ${x.n}</span><b style="font-size:11px;text-align:right;max-width:60%">${x.d}</b></div>`).join('')}
  <p style="color:var(--mut)">Weather is simulated from your area's typical climate, the real month and your phone's clock. It isn't a live forecast.</p>
  <button class="buy alt wide" data-a="zipopen">📍 Change ZIP code</button>`}
 else if(sheetKind==='b'){const k=sheetArg,t=S.tiles[k];if(!t||t.k==='belt'){closeSheet();return}const b=BT[t.k];
  h=X+`<h2>${b.icon} ${b.name}</h2><p>${b.desc}</p>`;
  if(t.k==='bank'){h+='<h3>Plant which variety?</h3><div class="seg">';for(let i=0;i<S.disc;i++)h+=`<button class="${t.v===i?'on':''}" data-a="bv:${i}">${dot(i)}${V[i].n.replace(' Pepper','')}<br>${i===0?'∞':fmt(S.seeds[i])}</button>`;
   h+='</div>';if(t.v>0)h+=`<div class="row"><div class="rt">Buy 10 ${V[t.v].n} seeds</div>${buy('seed:'+t.v,seedPrice(t.v),false)}</div>`;
   if(t.v>0&&S.seeds[t.v]<=0)h+='<p style="color:#ff8a7a">Out of seeds! Feed customers or cross-pollinate to earn more.</p>'}
  if(t.k==='farm'){h+=`<div class="stat"><span>Type</span><b>${t.hy?'💧 Hydroponic (2.5× faster, +2 plots)':'🟫 Soil'}</b></div><div class="stat"><span>Plots in use</span><b>${t.pl.length} / ${plots()+(t.hy?2:0)}</b></div>`;
   if(!t.hy)h+=`<div class="row"><div class="ri">💧</div><div class="rt"><b>Convert to Hydroponic</b><div class="rd">Grows 2.5× faster with 2 extra plots</div></div>${buy('hydro',hydroCost(),false)}</div>`;h+=`<div class="stat"><span>Weather</span><b>${t.hy?'Indoor — not affected':WXT[WX.type].i+' growth ×'+fmt2(wxGrow(V.length-1>0&&t.pl[0]?t.pl[0].t:0))}</b></div><div class="stat"><span>Protection</span><b>${PROT.has(k)?'🧴 Sprayed (−'+Math.round(sprayPen(S.up.eco))+' quality)':'🛡️ Natural '+Math.min(80,8*S.up.imm)+'%'}</b></div>`;
   if(t.inf>0)h+=`<div class="stat"><span>🦠 Infected</span><b>${Math.ceil(t.inf)}s left</b></div><div class="row"><div class="rt">Cure now</div>${buy('cure',cureCost(),false)}</div>`}
  if(t.k==='sort'){h+='<h3>Minimum quality to pass</h3><div class="seg">'+[1,2,3,4,5].map(n=>`<button class="${(t.thr||3)===n?'on':''}" data-a="thr:${n}">${n}★</button>`).join('')+'</div><p>Infected peppers are always rejected. Seeds always pass.</p>'}
  if(t.k==='store'){h+=`<div class="stat"><span>Stored</span><b>${t.c?t.c.length:0} / ${STORE_CAP}</b></div><div class="seg"><button class="${t.hold?'':'on'}" data-a="hold:0">▶ Release</button><button class="${t.hold?'on':''}" data-a="hold:1">⏸ Hold</button></div>`}
  if(t.k==='cross')h+=`<div class="stat"><span>Bays working</span><b>${t.sl?t.sl.length:0} / ${1+S.up.bays}</b></div><div class="stat"><span>Waiting peppers</span><b>${t.q?t.q.length:0}</b></div>`;
  if(t.k==='cross'&&S.disc<V.length)h+=`<div class="stat"><span>Researching</span><b>${V[S.disc].x?'Experimental':'???'} (from ${V[S.disc-1].n} pairs)</b></div><div class="bar"><i style="width:${S.res/resNeed()*100}%"></i></div>`;
  if(t.k==='taste')h+=`<div class="stat"><span>Peppers tasted</span><b>${fmt(S.st.fed)}</b></div><p>😍 3 seeds • 😋 2 • 😐 1 • 😖/🤢 none. Quality and Customer Charm improve reactions.</p>`;
  if(t.k==='market')h+=`<div class="stat"><span>Peppers sold</span><b>${fmt(S.st.sold)}</b></div>`;
  if(b.out)h+='<button class="buy alt wide" data-a="rot">🔄 Rotate output</button>'}
 sh.innerHTML=h;refreshSheet()}
const hydroCost=()=>Math.floor(1500*Math.pow(1.6,Object.values(S.tiles).filter(t=>t.k==='farm'&&t.hy).length));
let resetArm=false;
const cureCost=()=>Math.max(50,perSec()*15);
function refreshSheet(){if(!sheetKind)return;document.querySelectorAll('#sheet [data-c]').forEach(b=>b.classList.toggle('no',S.coins<+b.dataset.c));
 const pv=$('#prv');if(pv){pv.textContent=fmt(S.run);$('#prb').style.width=Math.min(100,S.run/presReq()*100)+'%'}}
$('#sheet').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const[a,v]=b.dataset.a.split(':');act(a,v)});
function act(a,v){const t=sheetKind==='b'?S.tiles[sheetArg]:null;
 if(a==='close')return closeSheet();
 if(a==='up'){const u=UP.find(x=>x.id===v),l=S.up[v],c=u.cost(l);if(l>=u.max||S.coins<c)return;S.coins-=c;S.up[v]++}
 else if(a==='seed'){const c=seedPrice(+v);if(S.coins<c)return;S.coins-=c;S.seeds[+v]+=10}
 else if(a==='pres'){if(S.run<presReq())return;prestige();closeSheet();return}
 else if(a==='bv')t.v=+v;
 else if(a==='thr')t.thr=+v;
 else if(a==='hold')t.hold=v==='1';
 else if(a==='rot'){t.d=(t.d+1)%4;rebuild()}
 else if(a==='hydro'){const c=hydroCost();if(t.hy||S.coins<c)return;S.coins-=c;t.hy=true;toast('💧 Farm converted to Hydroponic')}
 else if(a==='zipsave'){const z=($('#zipi').value||'').trim();if(!/^\d{5}$/.test(z)){toast('Enter a 5-digit ZIP code');return}
  S.zip=z;S.zipAsked=true;updWx(true);toast('📍 Climate zone: '+REG[regionOf(z)].n);save();const first=sheetArg;if(first&&!S.seen){S.seen=true;openSheet('help')}else openSheet('wx');return}
 else if(a==='zipskip'){S.zipAsked=true;save();const first=sheetArg;if(first&&!S.seen){S.seen=true;openSheet('help')}else closeSheet();return}
 else if(a==='zipopen'){openSheet('zip',0);return}
 else if(a==='wxon')S.wxOn=v==='1';
 else if(a==='reset'){if(!resetArm){resetArm=true;render();setTimeout(()=>{resetArm=false},4000);return}try{localStorage.removeItem(SAVE_KEY)}catch(e){}S=fresh();S.seen=true;S.zipAsked=true;BI={};rebuild();updWx(true);closeSheet();toast('Game reset');save();return}
 else if(a==='cure'){const c=cureCost();if(S.coins<c)return;S.coins-=c;t.inf=0;toast('🧪 Farm cured')}
 save();render()}
function prestige(){S.prest++;S.coins=150;S.run=0;for(const k in S.up)S.up[k]=0;S.seeds=V.map(()=>0);
 for(const k in S.tiles){const t=S.tiles[k];if(t.k==='farm'){t.pl=[];t.inf=0}delete t.q;delete t.c;delete t.buf}
 BI={};rebuild();save();toast('⭐ Prestige '+S.prest+'! Belts now carry '+lanes()+' lanes')}
$('#bUp').onclick=()=>openSheet('up');$('#bSeeds').onclick=()=>openSheet('seeds');$('#bPr').onclick=()=>openSheet('pr');$('#bHelp').onclick=()=>openSheet('help');$('#bSet').onclick=()=>openSheet('set');$('#wxb').onclick=()=>openSheet('wx');
function hud(){$('#coinv').innerHTML='🪙 <b>'+fmt(S.coins)+'</b>';const L=lanes();
 $('#rate').textContent=fmt(perSec()*60)+' /min • '+L+' lane'+(L>1?'s':'')+(S.prest?' • ⭐'+S.prest:'');
 $('#bPr').classList.toggle('glow',S.run>=presReq());
 if(S.disc<V.length){$('#resl').textContent='🐝 Next: '+(V[S.disc].x?'Experimental':'???');$('#resb').style.width=S.res/resNeed()*100+'%'}else $('#resl').textContent='🏆 All varieties found';
 updWx();$('#wxb').textContent=(S.wxOn?WXT[WX.type].i:'🚫')+' '+WX.temp+'°F';
 refreshSheet();if(tool==='build')renderPicker()}

/* ---------------- loop ---------------- */
let last=performance.now(),hudT=0;
function tick(now){let dt=(now-last)/1000;last=now;if(dt>5){away(dt);dt=0}dt=Math.min(dt,.1);step(dt);draw(now);hudT+=dt;if(hudT>.25){hudT=0;hud()}requestAnimationFrame(tick)}
function away(sec){const r=S.rate||perSec();if(r<=0)return;const g=Math.min(sec,4*3600)*r*.5;S.coins+=g;S.run+=g;S.total+=g;toast('While away you earned 🪙 '+fmt(g))}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});window.addEventListener('resize',resize);
rebuild();resize();setTool('hand');
if(S.t&&S.rate>0){const el=(Date.now()-S.t)/1000;if(el>30)away(el)}
updWx(true);
if(!S.zipAsked)openSheet('zip',1);else if(!S.seen){S.seen=true;openSheet('help')}
requestAnimationFrame(tick);
</script>
</body>
