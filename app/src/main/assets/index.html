<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pepper Farm Tycoon</title>
<style>
:root{--bg:#1d1410;--panel:#2c1f18;--gold:#ffc83d;--txt:#fff3e6;--mut:#c2a893;--green:#5cc43f;--red:#e5483b;--line:#4d3628}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
#hud{display:flex;align-items:center;gap:5px;padding:8px 8px 4px}
#coins{flex:1;min-width:0}
#coinv{font-size:21px;font-weight:900;color:#fff;text-shadow:0 2px 0 #000;white-space:nowrap}
#coinv b{color:var(--gold)}
#rate{font-size:11px;color:var(--mut);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{background:var(--panel);border:2px solid var(--line);color:var(--txt);border-radius:12px;padding:5px 3px;font-size:9.5px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:42px;flex:0 0 auto}
.hb span{font-size:18px;line-height:1}
@media (max-width:400px){#hud{gap:4px}.hb{min-width:34px;font-size:0;padding:6px 3px;gap:0}.hb span{font-size:18px}#coinv{font-size:17px}}
.hb.glow{border-color:var(--gold);box-shadow:0 0 12px #ffc83d99}
#res{margin:0 10px 4px;font-size:11px;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:6px}
#res .bar{flex:1;margin:0}
#wrap{flex:1;position:relative;min-height:0;overflow:hidden}
#zb{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;z-index:3}
#zb button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:#000b;color:#fff;font-size:20px;font-weight:900;line-height:1}
canvas{position:absolute;top:0;touch-action:none}
#hint{font-size:12px;color:var(--mut);text-align:center;padding:3px 8px;min-height:19px}
#picker{display:none;gap:6px;padding:2px 8px 0;overflow-x:auto;touch-action:pan-x}
.chip{flex:0 0 auto;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:4px 6px;font-size:10px;font-weight:800;color:var(--txt);text-align:center;min-width:64px}
.chip span{display:block;font-size:18px}
.chip.on{border-color:var(--gold);background:#43301c}
.chip.lock{opacity:.5}
.chip.cat{min-width:76px;background:#3a2a1f}
.chip small{color:var(--mut);font-weight:700}
#pwb{background:var(--panel);border:2px solid var(--line);color:var(--txt);border-radius:10px;padding:2px 7px;font-size:12px;font-weight:800;white-space:nowrap}
#pwb.low{border-color:#e5483b;color:#ffb0a8}
#wxb{background:var(--panel);border:2px solid var(--line);color:var(--txt);border-radius:10px;padding:2px 8px;font-size:12px;font-weight:800;white-space:nowrap}
#sheet input{width:100%;font-size:22px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:#1d1410;color:var(--txt);font-weight:800;letter-spacing:3px;user-select:text;-webkit-user-select:text;margin:6px 0}
#tools{display:flex;gap:5px;padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.tb{flex:1;background:var(--panel);border:2px solid var(--line);border-radius:12px;color:var(--txt);padding:6px 2px;font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}
.tb span{font-size:20px;line-height:1}
.tb.on{border-color:var(--gold);background:#43301c}
.drone{position:absolute;z-index:4;background:none;border:none;padding:8px;transition:transform 10s linear;cursor:pointer}
.drone .db{display:block;font-size:34px;line-height:1;animation:bob .7s ease-in-out infinite alternate;filter:drop-shadow(0 3px 4px #000a)}
.drone i{display:block;font-style:normal;font-size:18px;text-align:center;margin-top:-6px}
@keyframes bob{from{transform:translateY(-5px)}to{transform:translateY(5px)}}
#mine{position:fixed;inset:0;display:none;z-index:15;background:#000;touch-action:none}
#mcv{position:absolute;left:0;top:0}
#mhud{position:absolute;left:0;right:0;top:0;display:flex;gap:6px;align-items:center;padding:8px;font-weight:900;font-size:13px;color:#fff;text-shadow:0 1px 2px #000;pointer-events:none}
#mhud span{background:#000a;border-radius:9px;padding:5px 8px}
#mhud button{pointer-events:auto;margin-left:auto;background:var(--gold);color:#2a1a00;border:none;border-radius:10px;padding:8px 10px;font-weight:900;font-size:13px}
#mctl{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;padding:12px 12px calc(14px + env(safe-area-inset-bottom));pointer-events:none}
#mctl button{pointer-events:auto;width:68px;height:68px;border-radius:50%;border:2px solid #fff6;background:#0008;color:#fff;font-size:28px;font-weight:900;touch-action:none}
#mhint{position:absolute;left:0;right:0;bottom:96px;text-align:center;color:#fffc;font-size:12px;font-weight:700;pointer-events:none;text-shadow:0 1px 2px #000}
#toast{position:fixed;left:50%;top:96px;transform:translateX(-50%);background:#000d;border:2px solid var(--gold);padding:8px 14px;border-radius:12px;font-weight:800;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
#ov{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:10}
#sheet{background:var(--panel);border-top:3px solid var(--gold);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:82%;overflow:auto;padding:14px 14px calc(18px + env(safe-area-inset-bottom));touch-action:pan-y}
#sheet h2{margin:0 0 6px;font-size:19px}
#sheet h3{margin:12px 0 4px;font-size:15px;color:var(--gold)}
#sheet p{font-size:13px;color:#ecdccb;line-height:1.45;margin:6px 0}
.shx{position:sticky;top:-14px;height:0;z-index:6}
.x{position:absolute;right:-6px;top:-4px;width:38px;height:38px;border-radius:50%;background:#000c;border:2px solid var(--line);color:#fff;font-size:18px;line-height:1;padding:0}
#sheet h2{padding-right:40px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #43302a}
.ri{font-size:24px;width:34px;text-align:center}
.rt{flex:1;min-width:0;font-size:14px}
.rt small{color:var(--gold);font-weight:800}
.rd{font-size:12px;color:var(--mut)}
.buy{background:var(--green);color:#10260a;border:none;border-radius:10px;padding:9px 8px;font-weight:900;min-width:80px;font-size:13px}
.buy.no{background:#4d3f36;color:#8f7c6c}
.buy.max{background:#4d3f36;color:var(--gold)}
.buy.wide{width:100%;margin-top:8px;padding:12px}
.buy.alt{background:#4d3f36;color:var(--txt)}
.bar{height:11px;background:#43302a;border-radius:7px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--gold);width:0}
.seg{display:flex;gap:5px;margin:6px 0;flex-wrap:wrap}
.seg button{flex:1;min-width:52px;background:#43302a;border:2px solid var(--line);color:var(--txt);border-radius:9px;padding:7px 2px;font-weight:800;font-size:12px}
.seg button.on{border-color:var(--gold);background:#5a3f1c}
.stat{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px dashed #43302a}
.stat b{color:var(--gold)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;margin-right:4px;border:1px solid #0006}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="coins"><div id="coinv">🪙 0</div><div id="rate">0 /min</div></div>
    <button class="hb" id="bUp"><span>⬆️</span>Upgrade</button>
    <button class="hb" id="bSeeds"><span>🌶️</span>Peppers</button>
    <button class="hb" id="bPr"><span>⭐</span>Prestige</button>
    <button class="hb" id="bHelp"><span>❓</span>Help</button>
    <button class="hb" id="bMine"><span>⛏️</span>Mines</button>
    <button class="hb" id="bSet"><span>⚙️</span>Settings</button>
  </div>
  <div id="res"><span id="resl">Next: Banana Pepper</span><div class="bar"><i id="resb"></i></div><button id="wxb">⛅ --°</button><button id="pwb">⚡ 0</button></div>
  <div id="wrap"><canvas id="cv"></canvas><div id="zb"><button data-z="in">＋</button><button data-z="out">－</button><button data-z="home">🎯</button></div></div>
  <div id="hint"></div>
  <div id="picker"></div>
  <div id="tools">
    <button class="tb on" data-t="hand"><span>👆</span>Select</button>
    <button class="tb" data-t="belt"><span>🛤️</span>Belt</button>
    <button class="tb" data-t="build"><span>🏗️</span>Build</button>
    <button class="tb" data-t="rot"><span>🔄</span>Rotate</button>
    <button class="tb" data-t="erase"><span>🗑️</span>Remove</button>
  </div>
</div>
<div id="mine"><canvas id="mcv"></canvas><div id="mhud"><span id="mhp">❤️ 10/10</span><span id="mdp">⬇️ 0m</span><span id="mbag">🎒 0</span><button id="mexit">⬆️ Exit & sell</button></div><div id="mhint">Hold on a block to mine it. Tap enemies to hit them.</div><div id="mctl"><button id="mL">◀</button><button id="mR">▶</button><div style="flex:1"></div><button id="mJ">⤒</button></div></div>
<div id="toast"></div>
<div id="ov"><div id="sheet"></div></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const WORLD=64,WH=96,CH=8,NCH=8,NCHY=12,DROW=8,SP=0.5,BELT_FEE=50,SAVE_KEY='pepperfarm_v1';
const DX=[1,0,-1,0],DY=[0,1,0,-1];

/* ---------------- data ---------------- */
const V=[
 {n:'Bell Pepper',shu:'0',val:3,g:3,c:'#3fae3a',sh:'bell'},
 {n:'Banana Pepper',shu:'500',val:8,g:3.5,c:'#f2d03b',sh:'chili'},
 {n:'Poblano',shu:'1.5K',val:20,g:4,c:'#1f6d2c',sh:'wide'},
 {n:'Jalapeño',shu:'5K',val:50,g:4.5,c:'#2f9a3c',sh:'chili'},
 {n:'Serrano',shu:'15K',val:125,g:5,c:'#61c24a',sh:'thin'},
 {n:'Cayenne',shu:'40K',val:310,g:5.5,c:'#d8322c',sh:'thin'},
 {n:'Thai Chili',shu:'75K',val:780,g:6,c:'#ff3b2e',sh:'tiny'},
 {n:'Habanero',shu:'250K',val:1950,g:7,c:'#ff8a00',sh:'lantern'},
 {n:'Ghost Pepper',shu:'1M',val:4900,g:8,c:'#b3201e',sh:'chili'},
 {n:'Carolina Reaper',shu:'2.2M',val:12200,g:9,c:'#c4161c',sh:'reaper'},
 {n:'Pepper X',shu:'2.7M',val:30500,g:10,c:'#7d0a0a',sh:'reaper'},
 {n:'Magma Hybrid',shu:'5M',val:76000,g:11,c:'#ff4d00',sh:'chili',x:1},
 {n:'Plasma Pod',shu:'9M',val:190000,g:12,c:'#19d3ff',sh:'lantern',x:1},
 {n:'Void Pepper',shu:'???',val:480000,g:14,c:'#8c5cff',sh:'reaper',x:1}
];
const BT={
 bank:{name:'Seed Bank',icon:'🌰',cost:200,col:'#8d5a2b',out:1,pw:2,desc:'Automatically sends seeds of the variety you pick onto its belt. Your first bank is a tap bank: tap it to push seeds out.'},
 farm:{name:'Farm Plot',icon:'🌱',cost:60,col:'#4f7f2a',out:1,desc:'Takes seeds, grows peppers, sends them out.'},
 market:{name:'Market',icon:'🏪',cost:300,col:'#2f8f4e',desc:'Sells peppers for coins. Better quality = more coins.'},
 taste:{name:'Customers',icon:'😋',cost:150,col:'#c0602f',desc:'Must sit next to a Market. Customers buy peppers at that market\'s price, leave a review, and give seeds back: the better they like it, the more seeds.'},
 cross:{pw:4,name:'Pollination Warehouse',icon:'🐝',cost:500,col:'#7a6a55',out:1,desc:'An indoor farm where bees cross pairs of peppers into seeds. Bacteria can\'t get in. Pairs of your newest variety research the next one.'},
 store:{pw:1,name:'Storage',icon:'📦',cost:120,col:'#6d4a2b',out:1,desc:'Saves up product. Hold it, or release it down its belt.'},
 sort:{pw:1,name:'Quality Sorter',icon:'🔍',cost:250,col:'#3d6fb0',out:1,desc:'Good peppers go straight out. Low-star and infected ones go out the sides.'},
 split:{pw:0.5,name:'Splitter',icon:'🔀',cost:80,col:'#555d6b',out:1,desc:'Takes turns sending items out the front and both sides.'},
 spray:{name:'Pesticide Sprayer',icon:'🧴',cost:200,col:'#7b3fa0',desc:'Protects farms in the 3×3 area around it from bacteria, but lowers their pepper quality.'},
 barn:{pw:1,name:'Cow Barn',icon:'🐄',cost:400,col:'#a8372a',out:1,desc:'Cows make 💩 manure. Belt it into farms for 2× growth (+30s per load, up to 150s). Feed the cows rejected peppers for extra manure.'},
 arm:{pw:1,name:'Robotic Arm',icon:'🦾',cost:150,col:'#46505f',out:1,desc:'Grabs items from the tile behind it and drops them on the tile its arrow points at: belts, storage, farms, market, anything.'},
 solar:{gen:1,name:'Solar Panel',icon:'🔆',cost:800,col:'#1f3b66',desc:'Makes 4 ⚡ in full sun. Less in clouds and rain, none at night. Power Block only.'},
 wind:{gen:1,name:'Wind Turbine',icon:'🌬️',cost:1200,col:'#5d6c7c',desc:'Makes 6 ⚡. Spins harder in rain and storms, slower in a heat wave. Power Block only.'},
 bio:{gen:1,name:'Biogas Generator',icon:'♨️',cost:2500,col:'#4f5f22',desc:'Burns 💩 manure from your cows: each load gives 20s of 12 ⚡. Power Block only.'},
 farmers:{name:'Farmers Market',icon:'🧺',cost:250000,col:'#b5651d',desc:'Market District only. Pays ×1.6, plus +10% for every different variety in its last 12 sales. Customers can attach to it too.'},
 ugin:{name:'Tunnel Entrance',icon:'🕳️',cost:0,col:'#33363d',desc:'Belt goes underground here and comes up at the matching exit. Made automatically when you drag a belt across another belt or a building.'},
 ugout:{name:'Tunnel Exit',icon:'🕳️',cost:0,col:'#33363d',out:1,desc:'Where an underground belt comes back up.'},
 compost:{name:'Compost Bin',icon:'♻️',cost:40,col:'#4e3b2a',desc:'Destroys anything sent into it. Good for rejects.'}
};
const BORDER=['farm','bank','market','taste','cross','store','sort','split','spray','compost'];
const PERM=[
 {id:'pval',name:'Family Recipe',icon:'📜',desc:l=>'pepper value ×'+fmt2(Math.pow(1.25,l)),cost:l=>Math.ceil(2*Math.pow(1.5,l))},
 {id:'pgrow',name:'Heirloom Soil',icon:'🌿',desc:l=>'farm growth ×'+fmt2(Math.pow(1.15,l)),cost:l=>Math.ceil(2*Math.pow(1.5,l))},
 {id:'ptap',name:'Strong Hands',icon:'👆',desc:l=>'tap power ×'+fmt2(Math.pow(1.3,l)),cost:l=>Math.ceil(1*Math.pow(1.5,l))},
 {id:'pstack',name:'Big Harvest',icon:'🧺',desc:l=>'+'+l+' peppers per stack',cost:l=>Math.ceil(3*Math.pow(1.7,l))},
 {id:'pbelt',name:'Express Belts',icon:'⏩',desc:l=>'belt speed ×'+fmt2(Math.pow(1.1,l)),cost:l=>Math.ceil(2*Math.pow(1.5,l))},
 {id:'pcash',name:'Head Start',icon:'💰',desc:l=>'start each run with 🪙'+fmt(150*Math.pow(5,l)),cost:l=>Math.ceil(1*Math.pow(1.6,l))},
 {id:'poff',name:'Night Shift',icon:'🌙',desc:l=>'offline earnings '+Math.min(100,50+10*l)+'%',cost:l=>Math.ceil(2*Math.pow(1.6,l)),max:5}];
const pm=id=>(S.perm&&S.perm[id])||0;
const stackN=()=>2+(S.up.seedq||0)+pm('pstack');
const gpGain=()=>Math.max(3,Math.floor(3*Math.sqrt(S.run/presReq())));
const UP=[
 {id:'seedq',name:'Seed Genetics',icon:'🧬',desc:l=>(2+l)+' peppers per stack, +'+3*l+' quality, value ×'+fmt2(Math.pow(1.08,l))+', '+fmt2(Math.pow(1.2,l))+'× work per seed',cost:l=>300*Math.pow(2.2,l),max:1e9},
 {id:'speed',name:'Belt Speed',icon:'⏩',desc:l=>(1+.2*l).toFixed(1)+' tiles/s',cost:l=>60*Math.pow(1.8,l),max:1e9},
 {id:'fert',name:'Fertilizer',icon:'💩',cur:'m',desc:l=>'grow speed ×'+fmt2(1/Math.pow(.88,l))+' (paid in pasture manure)',cost:l=>Math.floor(15*Math.pow(1.55,l)),max:1e9},
 {id:'plots',name:'More Plots',icon:'🪴',desc:l=>(2+l)+' plots per farm',cost:l=>150*Math.pow(2.4,l),max:8},
 {id:'soil',name:'Rich Soil',icon:'🟫',desc:l=>'base quality '+Math.min(100,50+4*l),cost:l=>100*Math.pow(1.9,l),max:1e9},
 {id:'imm',name:'Plant Immunity',icon:'🛡️',desc:l=>Math.min(80,8*l)+'% chance to resist bacteria',cost:l=>120*Math.pow(2,l),max:10},
 {id:'eco',name:'Eco Pesticide',icon:'🍃',desc:l=>'spray quality penalty −'+Math.round(sprayPen(l)),cost:l=>200*Math.pow(2,l),max:1e9},
 {id:'hype',name:'Market Hype',icon:'📣',desc:l=>'sell price ×'+fmt2(Math.pow(1.25,l)),cost:l=>250*Math.pow(2.1,l),max:1e9},
 {id:'bays',name:'Pollination Bays',icon:'🐝',desc:l=>(1+l)+' pairs at once per warehouse',cost:l=>600*Math.pow(2.6,l),max:5},
 {id:'arm',name:'Arm Speed',icon:'🦾',desc:l=>fmt2(1/armP(l))+' moves/s per arm',cost:l=>200*Math.pow(1.9,l),max:1e9},
 {id:'charm',name:'Customer Charm',icon:'💬',desc:l=>'+'+(5*l)+' reaction score',cost:l=>150*Math.pow(2,l),max:1e9}
];

/* ---------------- state ---------------- */
function fresh(){const tiles={},put=(x,y,o)=>tiles[x+','+y]=o;
 put(27,0,{k:'bank',d:1,v:0,tap:true});for(let y=1;y<4;y++)put(27,y,{k:'belt',d:1});
 put(27,4,{k:'farm',d:1,pl:[],inf:0});for(let y=5;y<15;y++)put(27,y,{k:'belt',d:1});put(27,15,{k:'market',d:1});
 return{v:4,land:['3,0','3,1'],pland:[],dland:[],gp:0,perm:{},manure:0,rev:[],dem:V.map(()=>1),vs:V.map(()=>0),evT:200,ev:null,coins:150,run:0,total:0,prest:0,up:Object.fromEntries(UP.map(u=>[u.id,0])),disc:1,res:0,seeds:V.map(()=>0),
  tiles,rate:0,t:Date.now(),seen:false,zip:'',zipAsked:false,wxOn:true,ob:75,st:{sold:0,fed:0,cross:0,lost:0}}}
function load(){try{const r=localStorage.getItem(SAVE_KEY);if(!r)return null;const d=JSON.parse(r),f=fresh();
 if(!d.land&&d.tiles){const nt={};for(const k in d.tiles){const[x,y]=k.split(',').map(Number);nt[(x+24)+','+y]=d.tiles[k]}d.tiles=nt;d.land=['3,0','3,1'];d.v=2}
 return Object.assign(f,d,{up:Object.assign(f.up,d.up),st:Object.assign(f.st,d.st)})}catch(e){return null}}
let S=load()||fresh();
function fixSave(){const banks=Object.values(S.tiles).filter(t=>t.k==='bank');if(banks.length&&!banks.some(t=>t.tap))banks[0].tap=true;
 for(const t of Object.values(S.tiles))if(t.k==='barn'&&!t.herd){t.herd=[];for(let i=0;i<(t.cows||1);i++)t.herd.push(ADULT)}
 if(!S.dem||S.dem.length<V.length)S.dem=V.map((_,i)=>(S.dem&&S.dem[i])||1);if(!S.vs)S.vs=V.map(()=>0);if(!S.pland)S.pland=[];if(!S.dland)S.dland=[];if(!S.perm)S.perm={};if(!S.rev)S.rev=[];S.gp=S.gp||0;S.manure=S.manure||0;S.rare=S.rare||0;if(!S.mu)S.mu={};if(!S.mis||S.mis.length<3){S.mis=S.mis||[];while(S.mis.length<3)S.mis.push(newMission())}S.v=5}
function save(){S.t=Date.now();S.rate=perSec();try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}

/* ---------------- derived ---------------- */
const lanes=()=>Math.min(2+S.prest,6);
const seedWork=()=>Math.pow(1.2,S.up.seedq||0);
const LVX={bank:1.3,farm:1.12,barn:1.1,arm:1.15,cross:1.15,taste:1.15,store:1.5,market:1.08,sort:1.25,split:1.25,solar:1.2,wind:1.2,bio:1.2};
const lvl=t=>t.lv||0,lvM=t=>Math.pow(LVX[t.k]||1,lvl(t)),lvCost=t=>Math.floor(BT[t.k].cost*1.5*Math.pow(1.7,lvl(t)));
const fPlots=t=>plots()+(t.hy?2:0)+Math.floor(lvl(t)/3);
const autoRate=t=>.5*lvM(t)/seedWork();
const ADULT=120,barnCap=t=>4+2*lvl(t);
function pwUse(t){if(t.k==='farm')return t.hy?3:0;if(t.k==='bank')return t.tap?0:2;return(BT[t.k]&&BT[t.k].pw)||0}
const SOLW={sunny:1.3,night:0,cloudy:.5,rain:.3,storm:.1,heat:1.2,frost:.8},WINDW={sunny:.8,night:1,cloudy:1,rain:1.3,storm:2,heat:.6,frost:1.1};

 PW={sup:s,dem:d,f:d<=0?1:s>=d?1:Math.max(.1,s/d)};mktRec=Math.pow(1.15,mr);
 if(PW.f<1&&!lowPwWarned){lowPwWarned=true;toast('⚡ Not enough power! Machines are running slow. Buy a ⚡ Power Block and build generators.')}if(PW.f>=1)lowPwWarned=false}

const price=(it,mk)=>it.m?.5*vmult():it.s?V[it.t].val*.2*vmult():V[it.t].val*(.4+1.2*it.q/100)*vmult()*(it.inf?.1:1)*(S.dem[it.t]||1)*mkMult(mk)*(it.n||1)*(it.r?5:1);

 if(p>=995)return'AK';if(p>=967&&p<=968)return'HI';if((p>=850&&p<=865)||(p>=889&&p<=898))return'DS';if((p>=800&&p<=849)||(p>=870&&p<=885))return'MT';
 if(p>=900)return'WC';if(p>=320&&p<=349)return'FL';if(p>=700&&p<=799)return'SC';if(d<=1)return'NE';if(d<=3)return'SE';return'MW'}

function mul32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hsh(str){let h=2166136261;for(const c of str)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
function updWx(force){const blk=Math.floor(Date.now()/18e4),d=new Date(),hr=d.getHours(),key=S.zip+'|'+blk+'|'+hr;if(!force&&key===WX.key)return;
 const reg=REG[regionOf(S.zip)],rnd=mul32(hsh(key)),m=d.getMonth()+d.getDate()/31,sea=(1-Math.cos(2*Math.PI*(m-.5)/12))/2,night=hr<6||hr>=20;
 const temp=Math.round(reg.w+(reg.s-reg.w)*sea+(rnd()*16-8)-(night?15:0));let type;const r=rnd();
 if(temp<=34&&r<.7)type='frost';else if(temp>=96&&r<.6)type='heat';else{const r2=rnd();if(r2<reg.r)type=r2<reg.r*.25?'storm':'rain';else type=night?'night':(rnd()<.6?'sunny':'cloudy')}
 const prev=WX.type;WX={type,temp,key,until:(blk+1)*18e4};if(WX.key&&prev!==type&&S.wxOn&&!force)toast(WXT[type].i+' Weather changed: '+WXT[type].n)}
const wxOn=()=>S.wxOn;

let UGL={},SIMT=0,BI={},GEO={},PROT=new Set(),RR={};
const nrm=d=>[-DY[d],DX[d]];
function geom(x,y,i,o,L){const cx=x+.5,cy=y+.5,E=[cx-DX[i]*.5,cy-DY[i]*.5],X=[cx+DX[o]*.5,cy+DY[o]*.5],ni=nrm(i),no=nrm(o);
 const mk=d=>{const c=i===o?[no[0]*d,no[1]*d]:[(ni[0]+no[0])*d,(ni[1]+no[1])*d];return[[E[0]+ni[0]*d,E[1]+ni[1]*d],[cx+c[0],cy+c[1]],[X[0]+no[0]*d,X[1]+no[1]*d]]};
 const g={l:[],dv:[],c:mk(0)};for(let l=0;l<L;l++)g.l.push(mk(((l+.5)/L-.5)*.76));for(let l=1;l<L;l++)g.dv.push(mk((l/L-.5)*.76));return g}
function feeds(nb,s){return nb&&nb.d===s&&(nb.k==='belt'||BT[nb.k].out)}
function rebuild(){const L=lanes();LAND=new Set(S.land);LANDP=new Set(S.pland);LANDD=new Set(S.dland);
 for(const k in BI)if(!S.tiles[k]||S.tiles[k].k!=='belt')delete BI[k];
 GEO={};PROT=new Set();UGL={};
 for(const k in S.tiles){const t=S.tiles[k],[x,y]=xy(k);
  if(t.k==='belt'){if(!BI[k])BI[k]=[];while(BI[k].length<L)BI[k].push([]);
   let ind=t.d;if(!feeds(tileAt(x-DX[t.d],y-DY[t.d]),t.d)){for(const s of[(t.d+1)%4,(t.d+3)%4])if(feeds(tileAt(x-DX[s],y-DY[s]),s)){ind=s;break}}
   GEO[k]=geom(x,y,ind,t.d,L)}
  if(t.k==='ugin'){for(let j=1;j<=8;j++){const ok=K(x+DX[t.d]*j,y+DY[t.d]*j),o=S.tiles[ok];if(o&&o.k==='ugout'&&o.d===t.d){UGL[k]=ok;break}if(o&&o.k==='ugin'&&o.d===t.d)break}}
  if(t.k==='spray')for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)PROT.add(K(x+a,y+b))}
 renderPicker()}
function posAt(g,l,p){const[E,C,X]=g.l[l],u=1-p;return[u*u*E[0]+2*u*p*C[0]+p*p*X[0],u*u*E[1]+2*u*p*C[1]+p*p*X[1]]}

/* ---------------- movement ---------------- */
function insLane(k,l,it){const a=BI[k][l],last=a[a.length-1];if(last&&last.p<SP)return false;it.p=0;a.push(it);return true}
function push(x,y,d,it,lane){const nx=x+DX[d],ny=y+DY[d],nk=K(nx,ny),nt=S.tiles[nk];if(!nt)return false;
 if(nt.k==='belt'){if(nt.d===(d+2)%4||!BI[nk])return false;const L=lanes();
  if(lane!==undefined&&lane<L)return insLane(nk,lane,it);
  const r=RR[nk]||0;for(let i=0;i<L;i++){const l=(r+i)%L;if(insLane(nk,l,it)){RR[nk]=l+1;return true}}return false}
 return accept(nt,nk,it,d)}
function accept(t,k,it,d){
 switch(t.k){
  case'farm':if(it.m){if((t.fz||0)>=150)return false;t.fz=(t.fz||0)+30;return true}
   if(!it.s||t.pl.length>=fPlots(t))return false;t.pl.push({t:it.t,g:0,r:it.r||0});return true;
  case'market':case'farmers':{const g=price(it,t);earn(g);sellStats(it);if(t.k==='farmers'&&!it.s&&!it.m){t.mix=t.mix||[];t.mix.push(it.t);if(t.mix.length>12)t.mix.shift()}fl(k,'+'+fmt(g),'#ffc83d');return true}
  case'ugin':{const ok=UGL[k];if(!ok)return false;const o=S.tiles[ok];o.q=o.q||[];if(o.q.length>=4)return false;const[a,b]=xy(k),[c,e]=xy(ok);it.eta=SIMT+(Math.abs(c-a)+Math.abs(e-b))/speed();o.q.push(it);return true}
  case'bio':if(!it.m||(t.fuel||0)>=120)return false;t.fuel=(t.fuel||0)+20;return true;
  case'barn':if(it.s||it.m||(t.mq||0)>=12+4*lvl(t))return false;t.mq=(t.mq||0)+1;S.manure=(S.manure||0)+1;if(Math.random()<.3)fl(k,'🐄 munch','#ffe2c4');return true;
  case'taste':{const[tx,ty]=xy(k);if(it.s||it.m||!adjMarket(tx,ty)||(t.q=t.q||[]).length>=2)return false}t.q.push(it);return true;
  case'cross':if(it.s||it.m||(t.q=t.q||[]).length>=2*(1+S.up.bays))return false;t.q.push(it);return true;
  case'store':if((t.c=t.c||[]).length>=STORE_CAP*lvM(t))return false;t.c.push(it);return true;
  case'sort':case'split':if(t.buf)return false;t.buf=it;return true;
  case'compost':if(Math.random()<.3)fl(k,'♻️','#9ccf6a');return true;
 }return false}

const floats=[];const flAcc={};
function fl(k,txt,col){const[x,y]=xy(k);floats.push({x:x+.5,y:y+.15,t:1,txt,col})}
const buckets=new Array(60).fill(0);let bi=0,secs=0,secAcc=0,saveAcc=0,flashT=0;

function emit(t,x,y,it,dirs){const n=dirs.length,r=t.rr||0;for(let i=0;i<n;i++){const d=dirs[(r+i)%n];if(push(x,y,d,it)){t.rr=(r+i+1)%n;return true}}return false}
function harvestQ(k,hy){let q=50+4*S.up.soil+3*(S.up.seedq||0)+(Math.random()*30-15)+(hy?0:wxQ());if(PROT.has(k))q-=sprayPen(S.up.eco);return Math.round(Math.max(1,Math.min(100,q)))}
const REVT={'😍':['Best {v} I\'ve ever had!','Absolutely perfect {v}.','Five stars, buying more!'],'🥵':['Hot and amazing {v}!','Melted my face, loved it.','Perfect burn. Five stars!'],
 '😋':['Really good {v}.','Tasty! Would buy again.','Solid {v}.'],'🔥':['Nice heat on this {v}.','Spicy and fresh!','Great kick.'],'😐':['It\'s okay.','Average {v}.','Not bad, not great.'],
 '😖':['Pretty bland.','A bit mushy.','Wouldn\'t buy again.'],'🤢':['Ew, it was moldy!','Something was wrong with it.','Got sick. One star.']};
const REVS={'😍':5,'🥵':5,'😋':4,'🔥':4,'😐':3,'😖':2,'🤢':1};
function react(t,k,it){let n,e;const[tx,ty]=xy(k),mk=adjMarket(tx,ty);if(mk){earn(price(it,mk));sellStats(it)}
 if(it.inf){n=0;e='🤢'}else{const sc=it.q+(Math.random()*40-20)+5*S.up.charm,hot=it.t>=7;
  if(sc>=85){n=3;e=hot?'🥵':'😍'}else if(sc>=65){n=2;e=hot?'🔥':'😋'}else if(sc>=45){n=1;e='😐'}else{n=0;e='😖'}}
 if(it.t>0)S.seeds[it.t]+=n;const tip=n*V[it.t].val*.15*vmult();if(tip>0)earn(tip);S.st.fed++;
 fl(k,e+(n&&it.t>0?' +'+n+'🌰':''),'#fff');const tl=REVT[e];S.rev.unshift({e,t:it.t,s:REVS[e],x:tl[Math.floor(Math.random()*tl.length)].replace('{v}',V[it.t].n)});if(S.rev.length>12)S.rev.length=12}
function crossPair(k,a,b){
 if(a.inf||b.inf){fl(k,'🦠 ruined','#c79bff');return}
 const top=Math.max(a.t,b.t);if(top>0)S.seeds[top]+=2;S.st.cross++;
 if(a.t===S.disc-1&&b.t===S.disc-1&&S.disc<V.length){S.res+=Math.min(1.2,(a.q+b.q)/140)*(a.r||b.r?2:1);
  if(S.res>=resNeed()){S.res=0;S.disc++;S.seeds[S.disc-1]+=5;toast('🎉 New variety: '+V[S.disc-1].n+'! +5 seeds');flashT=.6;save()}}
 fl(k,top>0?'+2🌰':'🐝','#ffe08a')}
function updB(t,k,dt){const[x,y]=xy(k);
 if(t.k==='ugout'){if(t.q&&t.q.length&&t.q[0].eta<=SIMT&&push(x,y,t.d,t.q[0]))t.q.shift();return}
 switch(t.k){
  case'bank':{const L=lanes();
   if(t.tap){t.tp=Math.max(0,(t.tp||0)-dt*5);for(let i=0;i<L&&(t.sq||0)>0;i++){const l=((t.rl||0)+i)%L,rr=t.rare&&S.rare>0;if(!rr&&t.v>0&&S.seeds[t.v]<=0)break;
     if(push(x,y,t.d,{s:1,t:t.v,q:0,inf:false,r:rr?1:0},l)){t.sq--;if(rr)S.rare--;else if(t.v>0)S.seeds[t.v]--;t.rl=l+1}}break}
   const r=autoRate(t)*pf(t);t.a=t.a||[];
   for(let l=0;l<L;l++){t.a[l]=(t.a[l]||0)+r*dt;if(t.a[l]<1)continue;
    const rr=t.rare&&S.rare>0;if(!rr&&t.v>0&&S.seeds[t.v]<=0){t.a[l]=1;continue}
    if(push(x,y,t.d,{s:1,t:t.v,q:0,inf:false,r:rr?1:0},l)){t.a[l]-=1;if(rr)S.rare--;else if(t.v>0)S.seeds[t.v]--}else t.a[l]=1}break}
  case'farm':{if(t.inf>0)t.inf=Math.max(0,t.inf-dt);if(t.fz>0)t.fz=Math.max(0,t.fz-dt);
   for(let i=0;i<t.pl.length;i++){const p=t.pl[i];
    if(p.g<1){p.g+=dt*(boostOn()?2:1)*(t.fz>0?2:1)*lvM(t)*Math.pow(1.15,pm('pgrow'))*(t.hy?pf(t):wxGrow(p.t))/(growT(p.t)*(t.hy?.4:1));continue}
    if(!p.it)p.it={s:0,t:p.t,q:t.inf>0?5:p.r?100:harvestQ(k,t.hy),inf:t.inf>0,n:stackN(),r:p.r||0};
    if(emit(t,x,y,p.it,[t.d])){t.pl.splice(i,1);i--}}break}
  case'taste':if(t.q&&t.q.length){t.tm=(t.tm||0)+dt*lvM(t);if(t.tm>=1.2){t.tm=0;react(t,k,t.q.shift())}}break;
  case'cross':{t.sl=t.sl||[];while(t.sl.length<1+S.up.bays&&t.q&&t.q.length>=2){const p=t.q.splice(0,2);t.sl.push({a:p[0],b:p[1],g:0})}
   for(let i=0;i<t.sl.length;i++){const q=t.sl[i];q.g+=dt*lvM(t)*pf(t)/2.5;if(q.g>=1){crossPair(k,q.a,q.b);t.sl.splice(i,1);i--}}break}
  case'store':if(!t.hold&&t.c&&t.c.length){t.tm=(t.tm||0)+dt*pf(t)*Math.pow(1.2,lvl(t));while(t.tm>=.25&&t.c.length){if(emit(t,x,y,t.c[0],[t.d])){t.c.shift();t.tm-=.25}else{t.tm=.25;break}}}break;
  case'sort':t.cd=Math.max(0,(t.cd||0)-dt*8*lvM(t)*pf(t));if(t.buf&&t.cd<=0){t.cd=1;const it=t.buf,thr=t.thr||3,pass=it.s||it.m||(!it.inf&&stars(it.q)>=thr);
   if(pass?push(x,y,t.d,it):emit(t,x,y,it,[(t.d+3)%4,(t.d+1)%4]))t.buf=null;else t.cd=0}break;
  case'barn':{if(!t.herd)t.herd=[ADULT];t.mq=t.mq||0;let ad=0;for(let i=0;i<t.herd.length;i++){if(t.herd[i]<ADULT)t.herd[i]=Math.min(ADULT,t.herd[i]+dt);else ad++}
   t.bt=Math.min(45,(t.bt||0)+dt);if(ad>=2&&t.herd.length<barnCap(t)&&t.bt>=45){t.bt=0;t.herd.push(0);fl(k,'🐮 A calf is born!','#ffe2c4')}
   t.mt=(t.mt||0)+dt*ad/8*lvM(t)*pf(t);if(t.mt>=1){t.mt-=1;S.manure=(S.manure||0)+1;if(t.mq<12+4*lvl(t))t.mq++}
   if(t.mq>0&&push(x,y,t.d,{m:1,t:0,q:0,inf:false}))t.mq--;break}
  case'arm':{const P=armP(S.up.arm)/(lvM(t)*pf(t));if(t.ret>0)t.ret=Math.max(0,t.ret-dt/(P*.5));
   if(!t.h){if(!(t.ret>0)){const it=take(x-DX[t.d],y-DY[t.d]);if(it){t.h=it;t.ph=0}}}
   else{t.ph=Math.min(1,(t.ph||0)+dt/(P*.5));if(t.ph>=1&&push(x,y,t.d,t.h)){t.h=null;t.ph=0;t.ret=1}}break}
  case'split':t.cd=Math.max(0,(t.cd||0)-dt*8*lvM(t)*pf(t));if(t.buf&&t.cd<=0){if(emit(t,x,y,t.buf,[t.d,(t.d+3)%4,(t.d+1)%4])){t.buf=null;t.cd=1}}break;

 {const sx=p.x*T2-cx,sy=p.y*T2-cy,w=.7*T2,h=1.5*T2;if(!(p.inv>0&&Math.floor(now/80)%2)){

 if(ty==='mine'){const av=['copper','iron','gold','gem'].slice(0,Math.min(4,1+Math.floor(n/3))),o=av[Math.floor(R()*av.length)],need=Math.ceil({copper:12,iron:8,gold:5,gem:2}[o]*sc);m={ty,k:o,need,txt:'Mine '+need+' '+oreOf(o).n}}
 else if(ty==='kill'){const es=['slime','bat','blob'].slice(0,Math.min(3,1+Math.floor(n/3))),e=es[Math.floor(R()*es.length)],need=Math.ceil({slime:6,bat:5,blob:3}[e]*sc);m={ty,k:e,need,txt:'Defeat '+need+' '+ET[e].n+'s'}}
 else{const need=Math.min(MH-MS-3,Math.ceil(20+n*8));m={ty,need,txt:'Reach '+need+'m deep'}}
 const rr=R();m.rw=rr<.15?{gp:1}:rr<.45?{rare:1+Math.floor(n/4)}:{coins:1};m.prog=0;return m}
